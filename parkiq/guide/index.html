<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guides — GREEMS ParkIQ Workplace Charging</title>
<meta name="description" content="Pick the Manager guide or the Employee guide for GREEMS ParkIQ workplace charging.">
<link rel="canonical" href="https://lp.greems.io/parkiq/guide/">
<meta name="robots" content="index,follow">
<link rel="icon" type="image/svg+xml" href="../../icon.svg">
</head>
<body>
<div style="max-width:560px;margin:0 auto;padding:12px 18px 0"><a href="../" style="font:700 13px -apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#1D9E75;text-decoration:none" data-i18n="g_back">&larr; ParkIQ workplace charging</a></div>
<style>
  :root{--green:#1D9E75;--green-deep:#085041;--ink:#0F172A;--muted:#5B6B78;--line:#E4EAE7;--bg:#F4F8F6;--card:#FFFFFF;--soft:#EAF3EF;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  @media (prefers-color-scheme:dark){:root{--ink:#EAF3EF;--muted:#95A8A2;--line:#25332E;--bg:#0D1411;--card:#151F1B;--soft:#18241F}}
  :root[data-theme="light"]{--ink:#0F172A;--muted:#5B6B78;--line:#E4EAE7;--bg:#F4F8F6;--card:#FFFFFF;--soft:#EAF3EF}
  :root[data-theme="dark"]{--ink:#EAF3EF;--muted:#95A8A2;--line:#25332E;--bg:#0D1411;--card:#151F1B;--soft:#18241F}
  *{box-sizing:border-box}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);margin:0;padding:0 18px 64px;min-height:100vh;-webkit-font-smoothing:antialiased}
  .wrap{max-width:560px;margin:0 auto}
  .top{display:flex;align-items:center;gap:12px;padding:20px 0 8px}
  .mark{width:44px;height:44px;flex:0 0 auto}
  .brand{display:flex;flex-direction:column;line-height:1.05}
  .brand .eb{font-size:10px;letter-spacing:3px;color:var(--muted);font-weight:700}
  .brand .wm{font-size:19px;font-weight:800;color:var(--ink)}
  .lang{display:flex;gap:2px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px;margin-inline-start:auto}
  .lang b{font:600 12px/1 var(--sans);color:var(--muted);padding:7px 11px;border-radius:999px;cursor:pointer;transition:.15s}
  .lang b.on{background:var(--green);color:#05130D}
  .lang b:hover:not(.on){color:var(--ink)}
  h1{font-size:28px;margin:20px 0 4px}
  .lead{color:var(--muted);font-size:15px;margin-bottom:24px}
  .card{display:block;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px;text-decoration:none;color:inherit;transition:.15s}
  .card:hover{border-color:var(--green)}
  .card b{display:block;font-size:17px;margin-bottom:4px}
  .card span{color:var(--muted);font-size:14px}
</style>
<div class="wrap">
  <div class="top">
    <svg class="mark" viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="48" cy="48" r="40" fill="none" stroke="#9FE1CB" stroke-width="6"/>
      <circle cx="48" cy="48" r="29" fill="#1D9E75"/>
      <text x="48" y="60" font-family="Helvetica,Arial" font-size="34" fill="#fff" font-weight="700" text-anchor="middle">P</text>
    </svg>
    <div class="brand"><span class="eb">GREEMS</span><span class="wm">Park<em>IQ</em></span></div>
    <div class="lang" role="group" aria-label="Language">
      <b data-l="en" class="on" onclick="setLang('en')">EN</b>
      <b data-l="he" onclick="setLang('he')">עב</b>
    </div>
  </div>
  <h1 data-i18n="g_pick_h1">Guides</h1>
  <div class="lead" data-i18n="g_pick_p">Pick the guide for you.</div>
  <a class="card" href="manager/"><b data-i18n="g_pick_mgr_t">Manager guide</b><span data-i18n="g_pick_mgr_d">Set up access, bays, booking, scheduler and reports.</span></a>
  <a class="card" href="user/"><b data-i18n="g_pick_usr_t">Employee guide</b><span data-i18n="g_pick_usr_d">Book a charger, sign in and start charging.</span></a>
</div>
<script>
  const I18N={"g_pick_eb": {"en": "GREEMS ParkIQ", "he": "GREEMS ParkIQ"}, "g_pick_h1": {"en": "Guides", "he": "מדריכים"}, "g_pick_p": {"en": "Pick the guide for you.", "he": "בחרו את המדריך המתאים לכם."}, "g_pick_mgr_t": {"en": "Manager guide", "he": "מדריך למנהל"}, "g_pick_mgr_d": {"en": "Set up access, bays, booking, scheduler and reports.", "he": "הגדרת גישה, עמדות, הזמנות, מתזמן ודוחות."}, "g_pick_usr_t": {"en": "Employee guide", "he": "מדריך לעובד"}, "g_pick_usr_d": {"en": "Book a charger, sign in and start charging.", "he": "הזמנת עמדה, התחברות והתחלת טעינה."}, "g_back": {"en": "&larr; ParkIQ workplace charging", "he": "&larr; טעינת עובדים ParkIQ"}};
  function setLang(l){
    const h=document.documentElement;
    h.lang=l; h.dir = l==='he' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-i18n]').forEach(el=>{
      const k=el.getAttribute('data-i18n'); const v=I18N[k]&&I18N[k][l];
      if(v!=null) el.innerHTML=v;
    });
    document.querySelectorAll('.lang b').forEach(b=>b.classList.toggle('on', b.dataset.l===l));
    try{localStorage.setItem('parkiq_lang',l);}catch(e){}
  }
  (function(){
    let l='en';
    try{ l=localStorage.getItem('parkiq_lang') || ((navigator.language||'').slice(0,2)); }catch(e){}
    if(!['en','he'].includes(l)) l='en';
    setLang(l);
  })();
</script>
</body>
</html>
