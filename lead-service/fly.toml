app = "greems-lead"
primary_region = "fra"   # closest Fly region to Israel

[build]

[http_service]
  internal_port = 8080
  force_https = true
  # Scale to zero between submissions: a lead form is idle almost all the time,
  # so this keeps the cost at essentially nothing. Cold start is ~1s.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.http_options.response.headers]
    X-Content-Type-Options = "nosniff"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
