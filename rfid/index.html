<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>רישום כרטיס טעינה — Greems</title>
<meta name="description" content="רישום משתמש וכרטיס RFID לטעינה בעמדות Greems.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://lp.greems.io/rfid/">
<link rel="icon" type="image/svg+xml" href="../icon.svg">
<style>
  :root{--green:#1D9E75;--green-dark:#0d5c43;--ink:#0f172a;--muted:#475569;--line:#e2e8f0;--bg:#f8fafc}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);
    background:#e6f6ec;line-height:1.55}
  a{color:var(--green-dark)}
  :focus-visible{outline:3px solid var(--green-dark);outline-offset:2px;border-radius:6px}
  header.site{display:flex;align-items:center;justify-content:space-between;gap:1rem;
    max-width:560px;margin:0 auto;padding:16px 24px}
  header.site .brand img{height:38px;width:auto;display:block}
  .lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
  .lang button{border:0;background:transparent;padding:5px 11px;font-weight:700;font-size:1.15rem;line-height:1;
    cursor:pointer;color:var(--muted);min-height:34px}
  .lang button.on{background:var(--green-dark);color:#fff}
  main{max-width:560px;margin:0 auto;padding:8px 20px 60px}
  .panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;
    box-shadow:0 6px 24px rgba(15,23,42,.06)}
  h1{font-size:1.4rem;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 18px;font-size:.95rem}
  label{display:block;font-weight:600;font-size:.92rem;margin:14px 0 6px}
  label .req{color:#c0392b}
  input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:1rem;
    font-family:inherit;background:var(--bg)}
  input:focus{outline:none;border-color:var(--green);background:#fff}
  input.bad{border-color:#c0392b}
  #uid{font-family:ui-monospace,Menlo,monospace;letter-spacing:.06em}
  .hint{color:var(--muted);font-size:.82rem;margin-top:4px}
  button.go{margin-top:22px;width:100%;border:0;border-radius:12px;padding:15px;font-size:1.05rem;font-weight:800;
    color:#fff;background:var(--green-dark);cursor:pointer;min-height:52px}
  button.go:hover{background:#0a4734}
  button.go:disabled{opacity:.6;cursor:default}
  .formnote{margin-top:14px;color:#c0392b;font-size:.9rem;text-align:center;min-height:1em}
  .done{text-align:center;padding:14px 0}
  .done .tick{width:62px;height:62px;border-radius:50%;background:#e6f6ec;display:grid;place-items:center;margin:0 auto 14px}
  .done .tick svg{width:32px;height:32px;stroke:var(--green-dark);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
  .done h2{margin:0 0 6px;font-size:1.25rem}
  .done p{color:var(--muted);margin:0}
  .done .uidout{font-family:ui-monospace,Menlo,monospace;font-weight:700;color:var(--ink)}
  [hidden]{display:none !important}
</style>
</head>
<body>
<header class="site">
  <a class="brand" href="https://greems.io"><img src="../logo.svg" alt="Greems"></a>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="he" aria-label="עברית">🇮🇱</button>
    <button type="button" data-lang="en" aria-label="English">🇬🇧</button>
  </div>
</header>

<main>
  <div class="panel" id="panel">
    <h1 id="t-title">רישום כרטיס טעינה</h1>
    <p class="sub" id="t-sub">מלאו את הפרטים ואת מספר הכרטיס — הכרטיס יופעל לטעינה בכל עמדות Greems.</p>

    <form id="form" novalidate>
      <label for="first"><span id="t-first">שם פרטי</span> <span class="req">*</span></label>
      <input id="first" name="first_name" autocomplete="given-name" required>

      <label for="last"><span id="t-last">שם משפחה</span> <span class="req">*</span></label>
      <input id="last" name="last_name" autocomplete="family-name" required>

      <label for="email"><span id="t-email">דוא״ל</span> <span class="req">*</span></label>
      <input id="email" name="email" type="email" inputmode="email" autocomplete="email" required>

      <label for="phone"><span id="t-phone">טלפון נייד</span> <span class="req">*</span></label>
      <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" required>

      <label for="uid"><span id="t-uid">מספר כרטיס RFID</span> <span class="req">*</span></label>
      <input id="uid" name="uid" autocomplete="off" spellcheck="false" required>
      <div class="hint" id="t-uidhint">המספר המודפס על הכרטיס. אפשר להזין עם רווחים או נקודתיים.</div>

      <button class="go" id="submit" type="submit">הפעלת הכרטיס</button>
      <div class="formnote" id="note"></div>
    </form>

    <div class="done" id="done" hidden>
      <div class="tick"><svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="4 13 9 18 20 6"/></svg></div>
      <h2 id="t-donetitle">הכרטיס הופעל</h2>
      <p id="t-donesub"></p>
    </div>
  </div>
</main>

<script>
(function(){
  var API = "https://voltai-30142674525.me-west1.run.app";

  var I18N = {
    he:{ dir:"rtl", title:"רישום כרטיס טעינה",
         sub:"מלאו את הפרטים ואת מספר הכרטיס — הכרטיס יופעל לטעינה בכל עמדות Greems.",
         first:"שם פרטי", last:"שם משפחה", email:"דוא״ל", phone:"טלפון נייד", uid:"מספר כרטיס RFID",
         uidhint:"המספר המודפס על הכרטיס. אפשר להזין עם רווחים או נקודתיים.",
         submit:"הפעלת הכרטיס", sending:"רושם…",
         donetitle:"הכרטיס הופעל", donesub:"כרטיס %s רשום על שמך ומוכן לטעינה בעמדות Greems.",
         pendingtitle:"הרישום נקלט", pendingsub:"כרטיס %s נקלט וימתין לאישור הצוות. נעדכן אתכם.",
         err_first:"נא למלא שם פרטי", err_last:"נא למלא שם משפחה", err_email:"כתובת דוא״ל לא תקינה",
         err_phone:"מספר טלפון לא תקין", err_uid:"מספר כרטיס לא תקין",
         err_rate:"התקבלו יותר מדי רישומים מהכתובת הזו היום. נסו מחר או פנו לתמיכה.",
         err_server:"הרישום נכשל. נסו שוב, ואם זה חוזר — פנו לתמיכה." },
    en:{ dir:"ltr", title:"Charging card registration",
         sub:"Fill in your details and the card number — the card is activated for all Greems chargers.",
         first:"First name", last:"Last name", email:"Email", phone:"Mobile number", uid:"RFID card number",
         uidhint:"The number printed on the card. Spaces or colons are fine.",
         submit:"Activate my card", sending:"Registering…",
         donetitle:"Card activated", donesub:"Card %s is registered to you and ready to charge at Greems stations.",
         pendingtitle:"Registration received", pendingsub:"Card %s was received and is awaiting team approval. We'll be in touch.",
         err_first:"First name is required", err_last:"Last name is required", err_email:"Enter a valid email address",
         err_phone:"Enter a valid mobile number", err_uid:"Enter a valid card number",
         err_rate:"Too many registrations from this address today. Try tomorrow or contact support.",
         err_server:"Registration failed. Try again — if it keeps failing, contact support." }
  };

  var params = new URLSearchParams(location.search);
  var LANG = "he";
  try { var st = localStorage.getItem("greems_lang"); if (st && I18N[st]) LANG = st; } catch(e){}
  var qp = params.get("lang"); if (qp && I18N[qp]) LANG = qp;

  function d(){ return I18N[LANG]; }
  function $(id){ return document.getElementById(id); }

  function applyLang(){
    var t = d();
    document.documentElement.lang = LANG;
    document.documentElement.dir = t.dir;
    document.title = t.title + " — Greems";
    ["title","sub","first","last","email","phone","uid","uidhint","donetitle"].forEach(function(k){
      var el = $("t-" + k); if (el) el.textContent = t[k];
    });
    $("submit").textContent = t.submit;
    document.querySelectorAll(".lang button").forEach(function(b){
      b.classList.toggle("on", b.getAttribute("data-lang") === LANG);
    });
  }
  document.querySelectorAll(".lang button").forEach(function(b){
    b.addEventListener("click", function(){
      LANG = b.getAttribute("data-lang");
      try { localStorage.setItem("greems_lang", LANG); } catch(e){}
      applyLang();
    });
  });
  applyLang();

  // Pre-fill from the link the driver was sent (e.g. ?uid=04A2B3&email=...).
  ["uid","email","phone"].forEach(function(k){
    var v = params.get(k); if (v) $(k === "uid" ? "uid" : k).value = v;
  });

  // Same rules the server enforces — the server is the authority, this is only
  // so the driver sees the problem before a round trip.
  function normUid(v){ return (v||"").replace(/[\s:._-]+/g, ""); }
  function valid(f){
    if (!f.first_name) return "first";
    if (!f.last_name) return "last";
    if (!/^[^@\s]+@[^@\s.]+\.[^@\s]{2,}$/.test(f.email)) return "email";
    var digits = (f.phone||"").replace(/\D/g, "");
    if (digits.length < 7 || digits.length > 15) return "phone";
    if (!/^[0-9A-Za-z]{4,40}$/.test(normUid(f.uid))) return "uid";
    return null;
  }

  $("form").addEventListener("submit", function(ev){
    ev.preventDefault();
    var note = $("note"); note.textContent = "";
    document.querySelectorAll("input").forEach(function(i){ i.classList.remove("bad"); });

    var body = {
      first_name: $("first").value.trim(),
      last_name:  $("last").value.trim(),
      email:      $("email").value.trim(),
      phone:      $("phone").value.trim(),
      uid:        normUid($("uid").value)
    };
    var bad = valid(body);
    if (bad){
      $(bad === "first" ? "first" : bad).classList.add("bad");
      $(bad === "first" ? "first" : bad).focus();
      note.textContent = d()["err_" + bad];
      return;
    }

    var btn = $("submit");
    btn.disabled = true; btn.textContent = d().sending;

    fetch(API + "/rfid/register", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(body)
    })
    .then(function(r){ return r.json().then(function(j){ return {s:r.status, j:j}; }); })
    .then(function(res){
      if (res.s === 429){ throw new Error(d().err_rate); }
      if (!res.j || !res.j.ok){
        var f = res.j && res.j.field;
        if (f){ var id = f === "first_name" ? "first" : f === "last_name" ? "last" : f;
                var el = $(id); if (el) el.classList.add("bad");
                throw new Error(d()["err_" + (id === "first" ? "first" : id)] || d().err_server); }
        throw new Error(d().err_server);
      }
      var t = d(), pending = res.j.status !== "active";
      $("form").hidden = true;
      $("done").hidden = false;
      $("t-donetitle").textContent = pending ? t.pendingtitle : t.donetitle;
      $("t-donesub").innerHTML = (pending ? t.pendingsub : t.donesub)
        .replace("%s", '<span class="uidout">' + body.uid.replace(/[&<>]/g, "") + "</span>");
    })
    .catch(function(e){
      note.textContent = e.message || d().err_server;
      btn.disabled = false; btn.textContent = d().submit;
    });
  });
})();
</script></body></html>
