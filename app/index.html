<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Get the Greems app</title>
<meta name="description" content="Download the Greems EV charging app for iOS or Android.">
<link rel="icon" type="image/svg+xml" href="../icon.svg">
<style>
  :root{--green:#1D9E75;--green-dark:#0d5c43;--ink:#0f172a;--muted:#475569;--line:#e2e8f0;--bg:#f8fafc}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);
    background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:100%;text-align:center;padding:32px 20px;line-height:1.5}
  a{color:var(--green-dark)}
  :focus-visible{outline:3px solid var(--green-dark);outline-offset:2px;border-radius:8px}
  img.logo{height:96px;width:auto;margin-bottom:16px}
  h1{font-size:1.35rem;margin:.2rem 0 .4rem}
  p.sub{color:var(--muted);margin:0 0 24px}
  .spinner{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);
    border-top-color:var(--green);animation:spin .8s linear infinite;margin:8px auto 24px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.spinner{animation:none}}
  .badges{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:4px 0}
  .badges a{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:#fff;
    text-decoration:none;padding:12px 18px;border-radius:12px;font-weight:600;min-height:48px}
  .badges a:hover{background:#000}
  .badges small{display:block;font-size:.7rem;font-weight:500;opacity:.8;line-height:1}
  .badges b{font-size:1.05rem;line-height:1.1}
  .manual{margin-top:22px;font-size:.9rem;color:var(--muted)}
</style>
</head>
<body>
<!--
  Greems smart app-store redirect.
  QR / short link → this page → correct store by device.
  Destination URLs (edit here only):
-->
<script>
  // ===== CONFIG — destination URLs =====
  var APP_STORE_URL  = "https://apps.apple.com/il/app/greems/id6474761321";
  var PLAY_STORE_URL = "https://play.google.com/store/apps/details?id=com.greems.emsp";
  var FALLBACK_URL   = "https://greems.io"; // desktop / other devices
  // =====================================

  (function () {
    var ua = navigator.userAgent || "";
    var isAndroid = /android/i.test(ua);
    // Newer iPads report as "Macintosh" but expose touch points.
    var isIPadOS  = navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1;
    var isIOS     = /iphone|ipad|ipod/i.test(ua) || isIPadOS;

    var target = isAndroid ? PLAY_STORE_URL : isIOS ? APP_STORE_URL : FALLBACK_URL;

    // replace() — redirect page stays out of history / back button.
    window.location.replace(target);
  })();
</script>

<img class="logo" src="../logo.svg" alt="Greems Charging">
<h1>Redirecting to the app…</h1>
<p class="sub">Taking you to the right app store.</p>
<div class="spinner" role="status" aria-label="Redirecting"></div>

<div class="badges" aria-label="Download the Greems app">
  <a href="https://apps.apple.com/il/app/greems/id6474761321" aria-label="Download Greems on the Apple App Store">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="#fff" aria-hidden="true"><path d="M17.05 12.04c-.03-2.6 2.12-3.85 2.22-3.91-1.21-1.77-3.09-2.01-3.76-2.04-1.6-.16-3.12.94-3.93.94-.81 0-2.06-.92-3.39-.89-1.74.03-3.35 1.01-4.25 2.57-1.81 3.14-.46 7.79 1.3 10.34.86 1.25 1.89 2.65 3.23 2.6 1.3-.05 1.79-.84 3.36-.84 1.57 0 2.01.84 3.39.81 1.4-.02 2.29-1.27 3.15-2.53.99-1.45 1.4-2.85 1.42-2.92-.03-.01-2.72-1.04-2.75-4.13zM14.46 4.5c.71-.86 1.19-2.06 1.06-3.25-1.02.04-2.26.68-2.99 1.54-.66.76-1.23 1.98-1.08 3.15 1.14.09 2.3-.58 3.01-1.44z"/></svg>
    <span><small>Download on the</small><b>App Store</b></span>
  </a>
  <a href="https://play.google.com/store/apps/details?id=com.greems.emsp" aria-label="Get Greems on Google Play">
    <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path fill="#34A853" d="M3.6 2.3 13 11.7l-2.5 2.5z"/><path fill="#4285F4" d="M3.6 2.3 13 11.7 3.6 21z" opacity=".9"/><path fill="#FBBC05" d="M13 11.7 16.6 8l4 2.3c.9.5.9 1.8 0 2.3l-4 2.3z"/><path fill="#EA4335" d="M10.5 14.2 13 11.7l3.6 3.7-9 5.1z" opacity=".85"/></svg>
    <span><small>GET IT ON</small><b>Google Play</b></span>
  </a>
</div>

<p class="manual">Not redirected? <a href="https://greems.io">Tap here</a>.</p>

<noscript>
  <p class="sub">Choose your store:</p>
  <div class="badges">
    <a href="https://apps.apple.com/il/app/greems/id6474761321"><b>App Store</b></a>
    <a href="https://play.google.com/store/apps/details?id=com.greems.emsp"><b>Google Play</b></a>
  </div>
</noscript>
</body>
</html>
