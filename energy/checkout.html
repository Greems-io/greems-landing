<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>השלמת רכישה — Greems</title>
<link rel="icon" type="image/svg+xml" href="../icon.svg">
<style>
  :root{--green:#1D9E75;--green-dark:#0d5c43;--teal:#9FE1CB;--ink:#0f172a;--muted:#475569;--line:#e2e8f0;--bg:#f8fafc;
    --sun:#FFE08A;--sun-deep:#F2B33C;--sun-ink:#6f5012}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--ink);
    background:#e6f6ec;line-height:1.55}
  body::before{content:"";position:fixed;inset:0;z-index:-3;pointer-events:none;
    background:radial-gradient(32% 24% at 26% -4%, rgba(255,250,214,.95) 0%, rgba(255,250,214,0) 62%),
      radial-gradient(58% 55% at 88% 14%, #bfe9d2 0%, rgba(191,233,210,0) 56%),
      radial-gradient(58% 62% at 6% 70%, #a7ddc2 0%, rgba(167,221,194,0) 58%),
      linear-gradient(180deg, #ecf8f0 0%, #def2e7 100%)}
  body::after{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.8;
    background:linear-gradient(118deg, rgba(255,250,220,0) 32%, rgba(255,249,214,.24) 41%, rgba(255,250,220,0) 50%),
      radial-gradient(circle 90px at 82% 20%, rgba(255,249,210,.4), rgba(255,249,210,0) 72%),
      radial-gradient(circle 70px at 18% 60%, rgba(210,245,222,.45), rgba(210,245,222,0) 72%)}
  a{color:var(--green-dark)}
  :focus-visible{outline:3px solid var(--green-dark);outline-offset:2px;border-radius:6px}
  header.site{display:flex;align-items:center;justify-content:space-between;gap:1rem;
    max-width:760px;margin:0 auto;padding:16px 24px}
  header.site .brand img{height:38px;width:auto;display:block}
  .lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
  .lang button{border:0;background:transparent;padding:6px 12px;font-weight:700;font-size:.85rem;cursor:pointer;
    color:var(--muted);min-height:34px}
  .lang button.on{background:var(--green-dark);color:#fff}
  main{max-width:760px;margin:0 auto;padding:8px 20px 60px;display:grid;grid-template-columns:1fr;gap:20px}
  @media(min-width:760px){main{grid-template-columns:1.3fr .9fr;align-items:start}}
  .back{display:inline-block;margin:0 4px 8px;font-weight:600;text-decoration:none}
  .panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;
    box-shadow:0 6px 24px rgba(15,23,42,.06)}
  h1{font-size:1.4rem;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 20px;font-size:.95rem}
  label{display:block;font-weight:600;font-size:.92rem;margin:14px 0 6px}
  label .req{color:#c0392b}
  input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:1rem;
    font-family:inherit;background:var(--bg)}
  input:focus{outline:none;border-color:var(--green);background:#fff}
  .err{color:#c0392b;font-size:.82rem;margin-top:4px;min-height:1em}
  .hint{color:var(--muted);font-size:.82rem;margin-top:4px}
  button.pay{margin-top:22px;width:100%;border:0;border-radius:12px;padding:15px;font-size:1.05rem;font-weight:800;
    color:#fff;background:var(--green-dark);cursor:pointer;min-height:52px}
  button.pay:hover{background:#0a4734}
  button.pay:disabled{opacity:.6;cursor:default}
  .summary{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;
    box-shadow:0 6px 24px rgba(15,23,42,.06);position:sticky;top:16px}
  .summary .bonus{display:inline-block;font-size:.95rem;font-weight:800;color:var(--sun-ink);
    background:linear-gradient(90deg,var(--sun),var(--sun-deep));padding:4px 13px;border-radius:999px;
    margin-bottom:12px;box-shadow:0 3px 10px rgba(242,179,60,.3)}
  .summary .credit{font-size:2rem;font-weight:800;color:var(--green-dark);line-height:1}
  .summary .credit .cur{font-size:1rem;color:var(--muted);font-weight:700;margin-inline-start:2px}
  .summary .creditlbl{color:var(--muted);font-size:.88rem;margin-top:4px}
  .summary .row{display:flex;justify-content:space-between;align-items:center;margin-top:14px;
    padding-top:14px;border-top:1px dashed var(--line)}
  .summary .row.total{font-size:1.3rem;font-weight:800}
  .secure{margin-top:16px;color:var(--muted);font-size:.82rem;text-align:center}
  .formnote{margin-top:14px;color:#c0392b;font-size:.9rem;text-align:center;min-height:1em}
  .wa-fab{position:fixed;inset-block-end:18px;inset-inline-end:18px;z-index:50;width:56px;height:56px;
    border-radius:50%;background:#25D366;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.22)}
  .wa-fab:hover{background:#1da851}
  .wa-fab svg{width:30px;height:30px;fill:#fff}
</style>
</head>

  </a>
  <div class="lang" role="group" aria-label="Language">
    <button type="button" data-lang="he">ע</button>
    <button type="button" data-lang="en">EN</button>

</header>
<main>
  <div>
    <a class="back" id="back" href="./">→ חזרה לחבילות</a>
    <div class="panel">
      <h1 data-i18n="title">השלמת רכישה</h1>
      <p class="sub" data-i18n="sub">קוד הקרדיט יישלח לאימייל מיד לאחר התשלום.</p>
      <form id="form" novalidate>
        <label for="name"><span data-i18n="l_name">שם מלא</span> <span class="req">*</span></label>
        <input id="name" name="name" autocomplete="name" required>
        <div class="err" id="err-name"></div>

        <label for="email"><span data-i18n="l_email">אימייל</span> <span class="req">*</span></label>
        <input id="email" name="email" type="email" inputmode="email" autocomplete="email" required>
        <div class="err" id="err-email"></div>

        <label for="phone"><span data-i18n="l_phone">טלפון</span> <span class="req">*</span></label>
        <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="050-0000000" required>
        <div class="err" id="err-phone"></div>

        <label for="plate" data-i18n="l_plate">מספר רכב</label>
        <input id="plate" name="plate" inputmode="numeric" placeholder="12-345-67">
        <div class="hint" data-i18n="plate_hint">לא חובה — עוזר לנו לשייך את ההטענות לרכב שלך.</div>

        <button class="pay" id="pay" type="submit" data-i18n="pay_btn">המשך לתשלום מאובטח ←</button>
        <div class="formnote" id="formnote"></div>
      </form>
    </div>
  </div>

  <aside class="summary" id="summary"><div style="color:var(--muted)">…</div></aside>
</main>

<a class="wa-fab" href="https://wa.me/972779897660" target="_blank" rel="noopener" aria-label="WhatsApp">

</a>

<script>
(function(){
  "use strict";
  var API = "https://voltai-30142674525.me-west1.run.app";
  var I18N = {
    he:{ dir:"rtl", locale:"he-IL", back:"→ חזרה לחבילות", title:"השלמת רכישה",
      sub:"קוד הקרדיט יישלח לאימייל מיד לאחר התשלום.",
      l_name:"שם מלא", l_email:"אימייל", l_phone:"טלפון", l_plate:"מספר רכב",
      plate_hint:"לא חובה — עוזר לנו לשייך את ההטענות לרכב שלך.",
      pay_btn:"המשך לתשלום מאובטח ←", pay_loading:"מעבירים לתשלום…",
      e_name:"נא להזין שם", e_email:"נא להזין אימייל תקין", e_phone:"נא להזין טלפון תקין",
      e_generic:"אירעה שגיאה. נסו שוב בעוד רגע.", e_net:"אירעה שגיאת רשת. נסו שוב.",
      s_bonus:"בונוס", s_credit:"קרדיט", s_extra_a:"כולל ", s_extra_b:" בונוס מתנה",
      s_total:"לתשלום", secure:"🔒 תשלום מאובטח באמצעות Grow · כולל מע״מ" },
    en:{ dir:"ltr", locale:"en-US", back:"← Back to packages", title:"Checkout",
      sub:"Your credit code is emailed to you right after payment.",
      l_name:"Full name", l_email:"Email", l_phone:"Phone", l_plate:"License plate",
      plate_hint:"Optional — helps us link charges to your car.",
      pay_btn:"Continue to secure payment →", pay_loading:"Redirecting to payment…",
      e_name:"Please enter your name", e_email:"Please enter a valid email", e_phone:"Please enter a valid phone",
      e_generic:"Something went wrong. Try again in a moment.", e_net:"Network error. Please try again.",
      s_bonus:"bonus", s_credit:"credit", s_extra_a:"Includes ", s_extra_b:" bonus",
      s_total:"Total", secure:"🔒 Secure payment via Grow · incl VAT" }
  };

  var params = new URLSearchParams(location.search);
  var LANG = "he";
  try { var st = localStorage.getItem("greems_lang"); if (st && I18N[st]) LANG = st; } catch(e){}
  var qp = params.get("lang"); if (qp && I18N[qp]) LANG = qp;

  var pkgId = params.get("pkg") || "";
  var PKG = null;
  var form = document.getElementById("form");
  var btn = document.getElementById("pay");
  var note = document.getElementById("formnote");
  function dict(){ return I18N[LANG]; }
  function fmt(n){ return Number(n).toLocaleString(dict().locale); }
  function pct(n){ return (Number(n) % 1 === 0) ? n : Number(n).toFixed(1); }

  function renderSummary(){
    if (!PKG) return;
    var d = dict();
    document.getElementById("summary").innerHTML =
      '<span class="bonus">+'+pct(PKG.bonus_pct)+'% '+d.s_bonus+'</span>' +
      '<div class="credit">₪'+fmt(PKG.credit_ils)+'<span class="cur">'+d.s_credit+'</span></div>' +
      '<div class="creditlbl">'+d.s_extra_a+'₪'+fmt(PKG.bonus_ils)+d.s_extra_b+'</div>' +
      '<div class="row total"><span>'+d.s_total+'</span><span>₪'+fmt(PKG.pay_ils)+'</span></div>' +
      '<div class="secure">'+d.secure+'</div>';
  }

  function applyLang(){
    var d = dict();
    document.documentElement.lang = LANG;
    document.documentElement.dir = d.dir;
    document.querySelectorAll("[data-i18n]").forEach(function(el){
      var k = el.getAttribute("data-i18n"); if (d[k] != null) el.textContent = d[k];
    });
    document.getElementById("back").href = "./?lang=" + LANG;
    document.querySelectorAll(".lang button").forEach(function(b){
      b.classList.toggle("on", b.getAttribute("data-lang") === LANG);
    });
    renderSummary();
  }
  document.querySelectorAll(".lang button").forEach(function(b){
    b.addEventListener("click", function(){
      LANG = b.getAttribute("data-lang");
      try { localStorage.setItem("greems_lang", LANG); } catch(e){}
      applyLang();
    });
  });
  applyLang();

  fetch(API + "/energy/packages.json", {cache:"no-cache"})
    .then(function(r){ return r.json(); })
    .then(function(list){
      PKG = list.filter(function(p){ return p.id === pkgId; })[0];
      if (!PKG){ location.href = "./?lang=" + LANG; return; }
      renderSummary();
    })
    .catch(function(){ location.href = "./?lang=" + LANG; });

  function setErr(id,msg){ document.getElementById("err-"+id).textContent = msg||""; }
  function emailOk(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
  function phoneOk(v){ return v.replace(/[^0-9]/g,"").length >= 9; }

  form.addEventListener("submit", function(e){
    e.preventDefault();
    note.textContent = ""; var d = dict();
    if (!PKG) return;
    var name=form.name.value.trim(), email=form.email.value.trim(),
        phone=form.phone.value.trim(), plate=form.plate.value.trim();
    var ok=true;
    setErr("name", name ? "" : (ok=false,d.e_name));
    setErr("email", emailOk(email) ? "" : (ok=false,d.e_email));
    setErr("phone", phoneOk(phone) ? "" : (ok=false,d.e_phone));
    if(!ok) return;
    btn.disabled=true; btn.textContent=d.pay_loading;
    fetch(API + "/energy/order", {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({pkg:PKG.id, name:name, email:email, phone:phone, plate:plate})
    }).then(function(r){ return r.json().then(function(j){ return {ok:r.ok, j:j}; }); })
    .then(function(res){
      if(res.ok && res.j.redirect){ window.location.href = res.j.redirect; return; }
      note.textContent = res.j.message || d.e_generic;
      btn.disabled=false; btn.textContent=d.pay_btn;
    }).catch(function(){
      note.textContent = d.e_net; btn.disabled=false; btn.textContent=d.pay_btn;
    });
  });
})();
</script>
</body>
</html>
